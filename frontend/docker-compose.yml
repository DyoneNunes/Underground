# OBSOLETO: a stack agora sobe pelo docker-compose.yml da RAIZ (docker compose up -d --build).
# Não use este arquivo junto com o da raiz — os nomes de container conflitam.
name: undergroundtattoo-frontend

networks:
  underground-net:
    name: underground-net
    external: true

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3006/api}"
    container_name: underground_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    networks:
      - underground-net
